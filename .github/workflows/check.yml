name: Check

# The same checks the deploy runs before building, on every push and PR.
on:
  push:
    branches: [dev, main, main-cn]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve DNS submodule through GitHub mirror
        run: git config --global url."https://github.com/jadrens/calidns_dashboard.git".insteadOf "https://git.koi.ci/JadrenDev/calidns-dashboard.git"

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p .
      - name: Lint
        run: bun run lint --max-warnings=0
      - name: Test
        run: bun test
