name: Deploy production

on:
  push:
    branches:
      - run
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      DEPLOY_PATH: /home/dragonren/service/web/jadren_web_suit
      ARCHIVE_NAME: jadren-web-suit-build.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          DNS_MANAGER_TOKEN: ${{ secrets.DNS_MANAGER_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_SSL: ${{ secrets.POSTGRES_SSL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: bun run build

      - name: Package build
        run: tar -czf "$ARCHIVE_NAME" build

      - name: Upload build
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: ${{ env.ARCHIVE_NAME }}
          target: /home/dragonren/
          overwrite: true

      - name: Install release and restart service
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
          DNS_MANAGER_TOKEN: ${{ secrets.DNS_MANAGER_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_SSL: ${{ secrets.POSTGRES_SSL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,ARCHIVE_NAME,DNS_MANAGER_TOKEN,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_HOST,POSTGRES_PORT,POSTGRES_SSL,JWT_SECRET,RESEND_API_KEY
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            export PATH="$HOME/.bun/bin:$PATH"
            repository="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$(dirname "$DEPLOY_PATH")"
              git clone --branch run --depth 1 "$repository" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin run
            git checkout run
            git reset --hard origin/run
            bun install --frozen-lockfile

            rm -rf build
            tar -xzf "$HOME/$ARCHIVE_NAME"
            rm -f "$HOME/$ARCHIVE_NAME"

            umask 077
            {
              printf 'DNS_MANAGER_TOKEN=%s\n' "$DNS_MANAGER_TOKEN"
              printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
              printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
              printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
              printf 'POSTGRES_HOST=%s\n' "$POSTGRES_HOST"
              printf 'POSTGRES_PORT=%s\n' "$POSTGRES_PORT"
              printf 'POSTGRES_SSL=%s\n' "$POSTGRES_SSL"
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            } > .env

            mkdir -p data .data
            bun run db:migrate

            sudo install -m 0644 deploy/jadren-web-suit.service /etc/systemd/system/jadren-web-suit.service
            sudo systemctl daemon-reload
            sudo systemctl enable jadren-web-suit.service
            sudo systemctl restart jadren-web-suit.service

            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error \
                --header 'Host: jadren.me' \
                http://127.0.0.1:3000/ > /dev/null; then
                exit 0
              fi
              sleep 2
            done

            sudo journalctl -u jadren-web-suit.service -n 100 --no-pager
            exit 1
