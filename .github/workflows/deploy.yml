name: Deploy

# Manual only. Each target deploys its own release branch:
#   global -> main    (jadren.me, GitHub environment "production-global")
#   cn     -> main-cn (jadren.cn, GitHub environment "production-cn")
# Each environment holds its complete set of secrets (application + SSH_*);
# nothing is read from repository-level secrets, so a missing value fails the
# job instead of silently falling back to the other site's configuration.
#
# The runner ships everything the server needs (source + build) in one archive,
# so servers never contact GitHub: deploy/install-release.sh installs it using
# the npm mirror pinned in bun.lock and a checksummed Bun download.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options:
          - global
          - cn
        default: global

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target == 'cn' && 'production-cn' || 'production-global' }}

    env:
      DEPLOY_PATH: /home/dragonren/service/web/jadren_web_suit
      ARCHIVE_NAME: jadren-web-suit-release.tar.gz
      DEPLOY_BRANCH: ${{ inputs.target == 'cn' && 'main-cn' || 'main' }}
      SITE_HOST: ${{ inputs.target == 'cn' && 'jadren.cn' || 'jadren.me' }}
      BUN_VERSION: 1.4.0
      # sha256 of bun-linux-x64.zip for BUN_VERSION (from the release's SHASUMS256.txt).
      BUN_SHA256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
      # GitHub downloads are unreliable from mainland China; gh.koi.ci proxies GitHub.
      BUN_MIRRORS: >-
        ${{ inputs.target == 'cn'
          && 'https://registry.npmmirror.com/-/binary/bun/bun-v1.4.0/bun-linux-x64.zip https://gh.koi.ci/https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip'
          || 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip https://registry.npmmirror.com/-/binary/bun/bun-v1.4.0/bun-linux-x64.zip' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          DNS_MANAGER_TOKEN: ${{ secrets.DNS_MANAGER_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_SSL: ${{ secrets.POSTGRES_SSL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: bun run build

      # Tracked source (including the dns submodule) plus the build, minus Next's
      # build cache, which is large and only useful on the build machine.
      - name: Package release
        run: |
          git ls-files -z --recurse-submodules > release-files
          tar -czf "$ARCHIVE_NAME" --exclude=build/cache --null -T release-files build
          ls -lh "$ARCHIVE_NAME"

      - name: Upload release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: ${{ env.ARCHIVE_NAME }}
          target: /home/dragonren/
          overwrite: true

      - name: Install release and restart service
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
          SITE_HOST: ${{ env.SITE_HOST }}
          BUN_VERSION: ${{ env.BUN_VERSION }}
          BUN_SHA256: ${{ env.BUN_SHA256 }}
          BUN_MIRRORS: ${{ env.BUN_MIRRORS }}
          DNS_MANAGER_TOKEN: ${{ secrets.DNS_MANAGER_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_SSL: ${{ secrets.POSTGRES_SSL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,ARCHIVE_NAME,SITE_HOST,BUN_VERSION,BUN_SHA256,BUN_MIRRORS,DNS_MANAGER_TOKEN,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_HOST,POSTGRES_PORT,POSTGRES_SSL,JWT_SECRET,RESEND_API_KEY
          command_timeout: 10m
          script: |
            bash -c '
            set -Eeuo pipefail
            incoming="$DEPLOY_PATH.incoming"
            rm -rf "$incoming"
            mkdir -p "$incoming"
            tar -xzf "$HOME/$ARCHIVE_NAME" -C "$incoming"
            rm -f "$HOME/$ARCHIVE_NAME"
            exec bash "$incoming/deploy/install-release.sh" "$incoming"
            '
